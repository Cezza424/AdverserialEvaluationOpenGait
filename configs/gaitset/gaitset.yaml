ATTACK_MODE: attack_silhouette  # Options: baseline, attack_silhouette, attack_skeleton, combined_attack

attack_cfg:
  epsilon: 0.05       # L_inf bound for FGSM skeleton attack
  flip_prob: 0.40     # Edge flipping probability for silhouette attack
  perceptual_enabled: true      # Measure how visually noticeable the attack is with a perceptual loss
  perceptual_weight: 1.0        # Relative weighting of the perceptual loss in the attack report
  visualize_attacks: true       # Save side-by-side original vs attacked frame comparisons
  visualize_limit: 4            # Max number of frame comparisons to save per sample

data_cfg:
  dataset_name: CASIA-B
  dataset_root: C:\Users\25299867\Downloads\GaitDatasetB-PKL
  dataset_partition: C:\Users\25299867\PycharmProjects\OpenGait\datasets\CASIA-B\CASIA-B.json
  num_workers: 0
  remove_no_gallery: false
  test_dataset_name: CASIA-B

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 40000
  save_name: GaitSet
  sampler:
    batch_size: 1
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc # cos

loss_cfg:
  loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet

model_cfg:
  model: GaitSet
  in_channels:
    - 1
    - 32
    - 64
    - 128
  SeparateFCs:
    in_channels: 128
    out_channels: 256
    parts_num: 62
  bin_num:
    - 16
    - 8
    - 4
    - 2
    - 1

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones:
    - 10000
    - 20000
    - 30000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: GaitSet
  sync_BN: false
  total_iter: 40000
  sampler:
    batch_shuffle: false
    batch_size:
      - 8
      - 16
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_unordered
    type: TripletSampler
