data_cfg:
  dataset_name: HealthGait
  dataset_root: C:\Users\25299867\Downloads\HealthGait\silhouette_Heatmap  # <-- Point to the skeleton pickles
  dataset_partition: C:\Users\25299867\Downloads\HealthGait\partitions\Sex\opengait_partition_0.json # <-- Reuse your working partition!
  test_dataset_name: HealthGait
  num_workers: 0
  data_in_use: [True, True] # heatmap, sil
  remove_no_gallery: false # Remove probe if no gallery for it

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 20000
  save_name: SkeletonGaitPP_HealthGait_Finetune
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weights: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weights: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: SkeletonGaitPP
  Backbone:
    in_channels: 3
    blocks:
      - 1
      - 1
      - 1
      - 1
    C: 2
  SeparateBNNecks:
    class_num: 299

optimizer_cfg:
  lr: 0.001  # Reduced from 0.1 for gentle fine-tuning
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones:
    - 5000   # Scaled down from 20000
    - 10000  # Scaled down from 30000
    - 15000  # Scaled down from 40000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  fix_BN: false
  log_iter: 100
  restore_ckpt_strict: false  # CRITICAL: Must be false because class_num changed
  restore_hint: C:\Users\25299867\PycharmProjects\OpenGait\output\CCPG\SkeletonGaitPP\SkeletonGaitPP\checkpoints\SkeletonGaitPP-60000-clean.pt  # Use the absolute path
  optimizer_reset: true  # <-- ADD THIS: Flushes the old 100-subject momentum
  scheduler_reset: true  # <-- ADD THIS: Restarts the learning rate schedule
  save_iter: 5000
  save_name: SkeletonGaitPP_HealthGait_Finetune  # Renamed for safety
  sync_BN: true
  total_iter: 20000  # Reduced from 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 4
      - 4
    frames_num_fixed: 30
    frames_skip_num: 4
    sample_type: fixed_ordered
    type: TripletSampler
  transform:
    # - type: Compose
    #  trf_cfg:
    #    - type: BaseSilCuttingTransform
    #    - type: RandomHorizontalFlip
    #      prob: 0.5
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2

# Add this block to the bottom of skeletongait++_CCPG_Fine-tunedHealthGait.yaml
attack_cfg:
  #use_saliency: true
  #saliency_fraction: 0.2
  epsilon: 0.6       # L_inf bound for FGSM skeleton attack
  flip_prob: 0.4     # Edge flipping probability for silhouette attack