ATTACK_MODE: baseline  # Options: baseline, attack_silhouette, attack_skeleton, combined_attack

attack_cfg:
  epsilon: 0.6       # L_inf bound for FGSM skeleton attack
  flip_prob: 0.40     # Edge flipping probability for silhouette attack

data_cfg:
  dataset_name: CCPG
  dataset_root: C:\Users\25299867\Downloads\HealthGait\Heatmap\HealthGait_sigma_8.0_.pkl\pkl  # <-- Point to the skeleton pickles
  dataset_partition: C:\Users\25299867\Downloads\HealthGait\partitions\Sex\opengait_partition_3.json # <-- Reuse your working partition!
  test_dataset_name: HealthGait
  num_workers: 0
  data_in_use: [True] # heatmap, sil
  remove_no_gallery: false # Remove probe if no gallery for it

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 20000
  save_name: SkeletonGait_HealthGait_Finetune
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weights: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weights: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: DeepGaitV2
  Backbone:
    in_channels: 2
    mode: p3d
    layers:
      - 1
      - 1
      - 1
      - 1
    channels: 
      - 64
      - 128 
      - 256
      - 512
  SeparateBNNecks:
    class_num: 299
  use_emb2: true

optimizer_cfg:
  lr: 0.001
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 5000   # Scaled down from 20000
    - 10000  # Scaled down from 30000
    - 15000  # Scaled down from 40000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  restore_ckpt_strict: false
  restore_hint: C:\Users\25299867\PycharmProjects\OpenGait\output\CCPG\DeepGaitV2\SkeletonGait\checkpoints\SkeletonGait-60000.pt
  optimizer_reset: true  # <-- ADD THIS: Flushes the old 100-subject momentum
  scheduler_reset: true  # <-- ADD THIS: Restarts the learning rate schedule
  save_iter: 5000
  save_name: SkeletonGait_HealthGait_Finetune
  sync_BN: true
  total_iter: 20000
  sampler:
    batch_shuffle: true
    batch_size:
      - 4 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4  #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    frames_skip_num: 4
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2


